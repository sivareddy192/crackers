    <!-- LCP Banner Image Preload — dynamically injected from localStorage cache.
         BannerDisplay.jsx saves the real first banner URL after first API fetch.
         On repeat visits this gives instant LCP. On first visit, the inline
         hero h1 text is the LCP element (already paints at ~0.8s).             -->
    <script>
      (function() {
        try {
          var cached = localStorage.getItem('tracly_lcp_banner');
          if (cached) {
            var data = JSON.parse(cached);
            var url = data.url;
            if (url && url.startsWith('https://res.cloudinary.com')) {
              var link = document.createElement('link');
              link.rel = 'preload';
              link.as = 'image';
              link.setAttribute('fetchpriority', 'high');
              link.href = url;
              // Build responsive srcset from the cached URL pattern
              var srcset = url.replace(/,w_\d+/, ',w_360') + ' 360w, ' +
                           url.replace(/,w_\d+/, ',w_480') + ' 480w, ' +
                           url.replace(/,w_\d+/, ',w_720') + ' 720w';
              link.setAttribute('imagesrcset', srcset);
              link.setAttribute('imagesizes', '100vw');
              document.head.appendChild(link);
            }
          }
        } catch(e) { /* ignore storage errors */ }
      })();
    </script>
