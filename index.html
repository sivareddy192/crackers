    <script>
      (function() {
        try {
          var path = window.location.pathname;
          var token = localStorage.getItem('accessToken');
          var headers = {};
          if (token) headers['Authorization'] = 'Bearer ' + token;

          if (path.indexOf('/product/') === 0) {
            var parts = path.split('/').pop().split('-');
            var pId = parts.pop();
            if (pId && /^[a-f0-9]{24}$/i.test(pId)) {
              try {
                var cachedRaw = sessionStorage.getItem('trace_p_' + pId) || localStorage.getItem('trace_p_' + pId);
                if (cachedRaw) {
                  var p = JSON.parse(cachedRaw);
                  var img = Array.isArray(p.image) ? p.image[0] : p.image;
                  var imgUrl = typeof img === 'string' ? img : (img && (img.secure_url || img.url));
                  if (imgUrl && imgUrl.indexOf('res.cloudinary.com') !== -1) {
                    var l = document.createElement('link');
                    l.rel = 'preload';
                    l.as = 'image';
                    l.setAttribute('fetchpriority', 'high');
                    l.href = imgUrl.replace('/upload/', '/upload/f_auto,q_auto:good,c_limit,w_480/');
                    document.head.appendChild(l);
                  }
                }
              } catch(e) {}

              window.__TRACLY_PRODUCT_PREFETCH__ = fetch(
                'https://crackersbackend.vercel.app/api/product/get-product-details?productId=' + pId,
                {
                  method: 'GET',
                  headers: headers,
                  credentials: 'include',
                  priority: 'high'
                }
              ).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
            }
          } 
          else if (path === '/' || path === '') {
            try {
              var cachedBanner = localStorage.getItem('tracly_lcp_banner');
              if (cachedBanner) {
                var bData = JSON.parse(cachedBanner);
                if (bData.url && bData.url.indexOf('res.cloudinary.com') !== -1) {
                  var bLink = document.createElement('link');
                  bLink.rel = 'preload';
                  bLink.as = 'image';
                  bLink.setAttribute('fetchpriority', 'high');
                  bLink.href = bData.url;
                  var bBase = bData.url;
                  bLink.setAttribute('imagesrcset',
                    bBase.replace(/,w_\d+/, ',w_360') + ' 360w, ' +
                    bBase.replace(/,w_\d+/, ',w_480') + ' 480w, ' +
                    bBase.replace(/,w_\d+/, ',w_720') + ' 720w'
                  );
                  bLink.setAttribute('imagesizes', '100vw');
                  document.head.appendChild(bLink);
                }
              }
            } catch(e) {}

            window.__TRACLY_PREFETCH__ = fetch(
              'https://crackersbackend.vercel.app/api/product/home-feed',
              {
                method: 'GET',
                headers: headers,
                credentials: 'include',
                priority: 'high'
              }
            ).then(function(r) { return r.ok ? r.json() : null; }).catch(function() { return null; });
          }
        } catch(e) {
          window.__TRACLY_PREFETCH__ = null;
          window.__TRACLY_PRODUCT_PREFETCH__ = null;
        }
      })();
    </script>
