    <!-- Critical CSS for Instant Paint Shell -->
    <style>
      :root {
        --fire-primary: #ea580c;
        --fire-bg: #fffdfb;
      }
      /* Prevent FOIT on custom fonts — show system fallback immediately */
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: local('system-ui');
      }

        background-color: var(--fire-bg);
        color: #1e293b;
      }
      /* Avoid scrollbar jank shift */
      html { overflow-y: scroll; scrollbar-gutter: stable; }
      .critical-shell-header {
        height: 72px;
        background: rgba(255, 255, 255, 0.95);
        border-bottom: 1px solid rgba(226, 232, 240, 0.8);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 50;
        box-sizing: border-box;
      }
      .critical-shell-brand {
        font-family: "Outfit", system-ui, sans-serif;
        font-size: 24px;
        font-weight: 900;
        color: #ea580c;
        text-decoration: none;
        letter-spacing: -0.03em;
      }
      .critical-shell-hero {
        margin-top: 80px;
        padding: 12px;
        box-sizing: border-box;
      }
      .critical-shell-banner {
        aspect-ratio: 2.4 / 1;
        min-height: 180px;
        border-radius: 16px;
        background: linear-gradient(135deg, #fff7ed 0%, #ffffff 50%, #fef3c7 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        overflow: hidden;
      }
      /* Ensure React's immediate fallback hero uses the exact same box model to prevent CLS */
      #root > .critical-shell-hero { contain: layout size; }
      @media (min-width: 1024px) {
        .critical-shell-header { height: 80px; }
        .critical-shell-hero { margin-top: 88px; padding: 0; }
        .critical-shell-banner { aspect-ratio: 3.1 / 1; min-height: 340px; border-radius: 0; padding: 48px 8.5%; }
      }
    </style>
